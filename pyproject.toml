[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "campuslingo-v2-m0"
version = "0.0.0"
description = "Offline CLI evaluation/oracles only; the CampusLingo runtime is Rust/WASM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fsrs==6.3.2",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "pydantic==2.14.3",
  "pymupdf==1.28.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["tools/eval/python/campuslingo_ai", "tools/eval/python/campuslingo_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["hardware: explicit, non-default local hardware integration test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

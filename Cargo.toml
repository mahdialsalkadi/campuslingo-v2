[workspace]
members = ["crates/domain", "crates/storage", "crates/server", "crates/ingestion"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
schemars = "=1.2.3"
fsrs = { version = "=7.0.0", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "fs", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
sha2 = "=0.11.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

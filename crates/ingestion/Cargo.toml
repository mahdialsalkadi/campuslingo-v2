[package]
name = "campuslingo-ingestion"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
onnx = ["dep:ort"]

[dependencies]
campuslingo-domain = { path = "../domain" }
campuslingo-storage = { path = "../storage" }
tokio.workspace = true
sqlx.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
base64 = "=0.22.1"
chrono = "=0.4.45"
fs2 = "0.4"
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-23"] }

[dev-dependencies]
tempfile = "=3.27.0"

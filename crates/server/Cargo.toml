[package]
name = "campuslingo-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "campuslingo-server"

[dependencies]
campuslingo-domain = { path = "../domain" }
campuslingo-storage = { path = "../storage" }
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
argon2 = "=0.5.3"
getrandom.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"

[[bin]]
name = "campuslingo-recovery-worker"
path = "src/bin/recovery_worker.rs"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
